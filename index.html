<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mixing Table</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%236ee7b7'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="table">
      <header class="table__header">
        <h1>Mixing Table</h1>
        <p class="subtitle">Load a track, dial in the vibe.</p>
      </header>

      <section class="source">
        <input id="file-input" type="file" accept="audio/*" />
        <audio id="audio-el" controls></audio>
      </section>

      <section class="channel-strip">
        <article class="module" id="reverb-module">
          <div class="module__header">
            <h2>Reverb</h2>
            <label class="bypass">
              <input type="checkbox" id="reverb-bypass" />
              Bypass
            </label>
          </div>
          <label class="control">
            Mix
            <input type="range" id="reverb-mix" min="0" max="100" value="30" />
          </label>
          <label class="control">
            Decay
            <input type="range" id="reverb-decay" min="1" max="80" value="22" />
          </label>
          <label class="control">
            Pre-delay
            <input type="range" id="reverb-predelay" min="0" max="200" value="20" />
          </label>
        </article>

        <article class="module" id="delay-module">
          <div class="module__header">
            <h2>Delay</h2>
            <label class="bypass">
              <input type="checkbox" id="delay-bypass" />
              Bypass
            </label>
          </div>
          <label class="control">
            Mix
            <input type="range" id="delay-mix" min="0" max="100" value="25" />
          </label>
          <label class="control">
            Time
            <input type="range" id="delay-time" min="1" max="2000" value="300" />
          </label>
          <label class="control">
            Feedback
            <input type="range" id="delay-feedback" min="0" max="90" value="35" />
          </label>
          <label class="control">
            Tone
            <input type="range" id="delay-tone" min="200" max="18000" value="4000" />
          </label>
        </article>
      </section>

      <section class="master">
        <label class="control">
          Master
          <input type="range" id="master-volume" min="0" max="100" value="90" />
        </label>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
